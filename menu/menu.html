<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="icon" type="image/png" sizes="180x180" href="../favicon.png">
  <link rel="icon" type="image/svg+xml" href="../logo.svg">
  <title>Menu – Tawansy Restaurant &amp; Cafe, Chiang Mai</title>
  <meta name="description" content="Full menu with photos and prices: Tom Yum and soups, salads, som tum, curries, fried rice, stir-fries, spaghetti and more. In English, Thai and Chinese." />
  
  <!-- ===== Google + link preview cards (Facebook, LINE, WhatsApp…) ===== -->
  <link rel="canonical" href="https://tawansycnx.github.io/menu/menu.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tawansy Restaurant &amp; Cafe">
  <meta property="og:title" content="Menu – Tawansy Restaurant &amp; Cafe, Chiang Mai">
  <meta property="og:description" content="Full menu with photos and prices: Tom Yum and soups, salads, som tum, curries, fried rice, stir-fries, spaghetti and more. In English, Thai and Chinese.">
  <meta property="og:url" content="https://tawansycnx.github.io/menu/menu.html">
  <meta property="og:image" content="https://tawansycnx.github.io/images/res/share-1200x630.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="th_TH">
  <meta property="og:locale:alternate" content="zh_CN">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-search>
  <div data-include="header"></div>

  <div id="notice" class="notice" role="alert"></div>

  <!-- Lightbox for large image preview -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Image preview">
    <img id="lightboxImg" alt="">
    <button id="lightboxClose" aria-label="Close">✕</button>
  </div>
  
  <!-- Menu main -->
  <main class="container">
    <!-- Category header stays visible even for ALL -->
    <h2 id="categoryTitle" class="category-title">All</h2>

    <!-- Your items grid -->
    <div id="grid" class="grid" aria-live="polite"></div>
  </main>

  <!-- Footer include -->
  <div data-include="footer"></div>

  <script src="../scripts/site-config.js"></script>
  <script src="../scripts/site.js"></script>

  <script src="./scripts/config.js"></script>
  <script src="./scripts/scripts.js" defer></script>
</body>
</html>
