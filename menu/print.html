<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tawansy – Printable Menu</title>
<meta name="robots" content="noindex">  <!-- staff page: keep out of Google -->
<link rel="icon" type="image/png" href="../favicon.png">
<!-- Fonts (need internet when opening the page; the browser falls back to system fonts otherwise) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;700&family=Sarabun:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   TAWANSY PRINT MENU
   Reads ./data/menu.json + ./data/categories.json and lays out A4 pages.
   Print with Chrome: Ctrl+P → Destination "Save as PDF" (or printer),
   Paper A4, Margins "None", tick "Background graphics".
   ===================================================================== */
:root{
  --frame:#8b5a2b;        /* brown page frame            */
  --frame-soft:#e9d6bd;
  --cream:#fbf4e6;        /* text bubble background      */
  --ink:#2b2118;          /* main text                   */
  --name:#1f3a8a;         /* dish names (blue, like Canva) */
  --muted:#6b5b4b;        /* descriptions                */
  --accent:#e2701f;       /* orange from the logo        */
  --price:#2b2118;
  --halal:#1e7d3a; --spicy:#c62828; --veg:#4f8a10; --sea:#1565c0; --new:#e2701f;
  --f-title:'Kanit','Loma','Noto Sans CJK SC',sans-serif;
  --f-body:'Sarabun','Loma','Noto Sans SC','Noto Sans CJK SC',sans-serif;
  --f-cn:'Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#d9d4cc;color:var(--ink);font-family:var(--f-body);-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ---------- On-screen toolbar (hidden when printing) ---------- */
.toolbar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;
  padding:10px 16px;background:#2b2118;color:#fff;font:14px/1.3 system-ui,Segoe UI,sans-serif}
.toolbar b{color:#ffcf8a}
.toolbar label{display:flex;align-items:center;gap:6px;cursor:pointer}
.toolbar select,.toolbar button{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid #6b5b4b;background:#3a2e24;color:#fff;cursor:pointer}
.toolbar button.primary{background:var(--accent);border-color:var(--accent);font-weight:600}
.toolbar .info{opacity:.8}
.toolbar .tip{flex-basis:100%;opacity:.7;font-size:12px}
#status{padding:40px;text-align:center;font:16px system-ui,sans-serif}

/* ---------- A4 page ---------- */
@page{size:A4;margin:0}
.pages{display:flex;flex-direction:column;align-items:center;gap:10mm;padding:10mm 0}
.page{position:relative;width:210mm;height:297mm;background:#fff;overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,.25);display:flex;flex-direction:column;padding:9mm 10mm 8mm}
.page::before{ /* brown rounded frame */
  content:"";position:absolute;inset:4mm;border:2.2mm solid var(--frame);border-radius:7mm;pointer-events:none}
.page::after{ /* thin inner line */
  content:"";position:absolute;inset:7.4mm;border:.35mm solid var(--frame-soft);border-radius:4.5mm;pointer-events:none}

/* Header */
.p-head{position:relative;display:flex;align-items:center;justify-content:space-between;height:26mm;padding:0 3mm;flex:none}
.p-title{font-family:var(--f-title);font-weight:700;line-height:1;display:flex;align-items:baseline;gap:5mm;color:var(--ink)}
.p-title .th{font-size:32pt}
.p-title .en{font-size:26pt;color:var(--frame)}
.p-title .cont{font-family:var(--f-body);font-weight:400;font-size:10pt;color:var(--muted);align-self:center}
.p-logo{width:24mm;height:24mm;object-fit:contain}
.p-rule{height:.6mm;background:linear-gradient(90deg,var(--accent),var(--frame) 60%,transparent);margin:0 3mm 3mm;flex:none;border-radius:1mm}

/* Footer */
.p-foot{flex:none;height:15mm;display:flex;align-items:flex-end;justify-content:space-between;padding:0 1mm 0 0;font-size:8pt;color:var(--muted)}
.p-foot .halal{width:15mm;height:15mm;object-fit:contain}
.p-foot .pn{font-weight:700;color:var(--frame);padding-bottom:1mm}

/* Body area */
.p-body{flex:1;min-height:0;padding:0 3mm;display:grid;gap:3.5mm}

/* ---------- Shared dish bits ---------- */
.d-photo{border-radius:4mm;overflow:hidden;background:#f1ebe2;flex:none}
.d-photo img{width:100%;height:100%;object-fit:cover;display:block}
.d-text{background:var(--cream);border-radius:4mm;padding:2.8mm 3.8mm;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.d-num{font-weight:700;color:var(--accent)}
.d-th{font-weight:600;color:var(--name)}
.d-en{font-weight:700;color:var(--name);line-height:1.2}
.d-cn{font-family:var(--f-cn);color:var(--name);opacity:.9}
.d-desc{font-style:italic;color:var(--muted);line-height:1.3;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.d-bottom{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:3mm;padding-top:1.5mm}
.d-badges{display:flex;flex-wrap:wrap;gap:1.2mm}
.bdg{font-size:6.8pt;font-weight:700;line-height:1;padding:.9mm 1.8mm;border-radius:10mm;border:.3mm solid currentColor;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.bdg.halal{color:var(--halal)} .bdg.spicy{color:var(--spicy)} .bdg.vegetarian{color:var(--veg)}
.bdg.seafood{color:var(--sea)} .bdg.new{color:#fff;background:var(--new);border-color:var(--new)}
.bdg.sig{color:#fff;background:var(--frame);border-color:var(--frame)}
/* icons-only badges + footer legend (2026-10-06) */
.bdg small.q{text-transform:none;font-size:6.3pt;font-weight:600;letter-spacing:0;margin-left:.6mm;color:var(--veg)}
.bdg.spicy,.bdg.vegetarian,.bdg.seafood,.bdg.nuts{border:none;padding:0;font-size:9pt;letter-spacing:-.5mm}
.bdg.sig{font-size:7.5pt;padding:.7mm 1.4mm}
.p-foot .f-spacer{width:15mm;flex:none} /* same width as the halal logo, keeps the legend centred on the page */
.p-foot .legend{flex:1;display:flex;flex-wrap:wrap;gap:.6mm 3mm;align-items:center;justify-content:center;text-align:center;font-size:6.3pt;color:var(--muted);line-height:1.25;padding:0 3mm}
.p-foot .legend b.sig{display:inline-block;color:#fff;background:var(--frame);border-radius:10mm;padding:0 1.2mm;margin-right:1mm;font-weight:700}
.p-foot .legend .okey{flex-basis:100%;display:flex;justify-content:center;gap:3.5mm;white-space:nowrap;overflow:hidden;color:var(--name);font-weight:600}
.p-foot .legend .lvl{flex-basis:100%;text-align:center;color:var(--spicy);font-weight:600}
.d-price{font-weight:700;color:var(--price);text-align:right;white-space:nowrap}
.d-price .cur,.d-opts .cur{font-size:.7em;font-weight:600;margin-left:.6mm;color:var(--muted)}
.d-opts{text-align:right;line-height:1.35}
.d-opts div{white-space:nowrap}
.d-opts .lbl{font-weight:600;color:var(--muted)}
.d-opts .val{font-weight:700;margin-left:1.5mm}
.oos-tag{position:absolute;top:2mm;left:2mm;background:rgba(0,0,0,.65);color:#fff;font-size:7pt;font-weight:700;padding:.8mm 2mm;border-radius:2mm}
.d-photo{position:relative}
.d-photo.cutout{background:none;border-radius:0;overflow:visible}
.d-photo.cutout img{object-fit:contain}

/* ---------- CLASSIC layout: 4 dishes per page, photo alternates left/right ---------- */
.layout-classic .p-body{grid-template-rows:repeat(var(--rows,4),1fr)}
.layout-classic .dish{display:flex;align-items:center;gap:4mm;min-height:0}
.layout-classic .dish.flip{flex-direction:row-reverse}
.layout-classic .d-photo{width:82mm;height:100%;max-height:57mm}
.layout-classic .d-text{flex:1;height:100%;max-height:57mm}
.layout-classic .d-head{font-size:10pt;line-height:1.3}
.layout-classic .d-en{font-size:12pt;margin-top:.4mm}
.layout-classic .d-th,.layout-classic .d-num{font-size:12pt}
.layout-classic .d-cn{font-size:9.5pt;margin-top:.4mm}
.layout-classic .d-desc{font-size:9pt;margin-top:1.4mm;-webkit-line-clamp:3}
.layout-classic .d-price{font-size:16pt}
.layout-classic .d-opts{font-size:9.5pt}

/* ---------- CLASSIC, large size: 3 dishes per page (category fits better in 3s) ---------- */
.layout-classic .rows-3 .d-photo{width:100mm;max-height:none}
.layout-classic .rows-3 .d-text{max-height:none;padding:4mm 5mm}
.layout-classic .rows-3 .d-th,.layout-classic .rows-3 .d-num{font-size:14pt}
.layout-classic .rows-3 .d-en{font-size:14.5pt;margin-top:.8mm}
.layout-classic .rows-3 .d-cn{font-size:11pt;margin-top:.6mm}
.layout-classic .rows-3 .d-desc{font-size:10pt;margin-top:2mm;-webkit-line-clamp:5}
.layout-classic .rows-3 .d-price{font-size:18pt}
.layout-classic .rows-3 .d-opts{font-size:10.5pt}

/* ---------- Filler tile in leftover space: QR | logo | QR ----------
   Fixed sizes (not % of the tile) so each QR code and its captions share one centre line.
   .f-small = tile of 1/4 page or less -> smaller QR codes + logo. */
.filler{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:center;gap:6mm;min-height:0;
  background:var(--cream);border-radius:4mm;border:.35mm dashed var(--frame-soft);padding:3mm 6mm;overflow:hidden}
.filler .f-logo{width:38mm;height:38mm;object-fit:contain}
.filler .f-qr{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.2mm;width:100%;min-width:0}
.filler .f-qr img{width:34mm;height:34mm;border-radius:2mm;background:#fff;padding:1mm;display:block}
.filler .f-qr .t1{font-family:var(--f-title);font-weight:700;font-size:10pt;color:var(--frame);line-height:1.1}
.filler .f-qr .t2{font-size:8pt;color:var(--muted);line-height:1.2}
.filler.f-small{padding:2mm 6mm}
.filler.f-small .f-logo{width:30mm;height:30mm}
.filler.f-small .f-qr img{width:25mm;height:25mm}
.filler.f-small .f-qr{gap:.8mm}
.filler.f-small .f-qr .t1{font-size:9pt}
.filler.f-small .f-qr .t2{font-size:7pt;line-height:1.1}

/* ---------- COMPACT layout: 8 dishes per page (2 columns × 4 rows) ---------- */
.layout-compact .p-body{grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);column-gap:4mm}
.layout-compact .dish{display:flex;gap:2.5mm;min-height:0;background:var(--cream);border-radius:4mm;padding:2.2mm}
.layout-compact .d-photo{width:37mm;height:100%;border-radius:3mm}
.layout-compact .d-text{flex:1;padding:.5mm 1mm;background:none;border-radius:0}
.layout-compact .d-head{font-size:8.5pt;line-height:1.25}
.layout-compact .d-en{font-size:9.5pt;margin-top:.3mm}
.layout-compact .d-th,.layout-compact .d-num{font-size:9.5pt}
.layout-compact .d-cn{font-size:8pt;margin-top:.3mm}
.layout-compact .d-desc{font-size:7.6pt;margin-top:.8mm;-webkit-line-clamp:3}
.layout-compact .d-price{font-size:12.5pt}
.layout-compact .d-opts{font-size:8pt}
.layout-compact .bdg{font-size:6pt;padding:.7mm 1.4mm}

/* ---------- Print ---------- */
@media print{
  body{background:#fff}
  .toolbar,#status{display:none!important}
  .pages{display:block;padding:0}
  .page{box-shadow:none;break-after:page;page-break-after:always;margin:0}
  .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>

<div class="toolbar">
  <b>Tawansy · Print Menu</b>
  <label>Layout
    <select id="optLayout">
      <option value="classic">Classic – 4 dishes per page</option>
      <option value="compact">Compact – 8 dishes per page</option>
    </select>
  </label>
  <label><input type="checkbox" id="optOos"> Include out-of-stock dishes</label>
  <span class="info" id="pageCount"></span>
  <button class="primary" onclick="window.print()">Print / Save as PDF</button>
  <span class="tip">Chrome print settings: Paper size A4 · Margins None · tick “Background graphics” · Scale 100 (Default).</span>
</div>

<div id="status">Loading menu…</div>
<div id="pages" class="pages"></div>

<script>
(function(){
  const MENU_URL = './data/menu.json';
  const CAT_URL  = './data/categories.json';
  const LOGO     = '../logo-256.png';
  const HALAL    = '../images/res/halal.png';
  const PER_PAGE = { classic: 4, compact: 8 };

  const params = new URLSearchParams(location.search);
  const state = {
    layout: PER_PAGE[params.get('layout')] ? params.get('layout') : 'classic',
    oos: params.get('oos') === '1'
  };
  const $ = id => document.getElementById(id);
  $('optLayout').value = state.layout;
  $('optOos').checked = state.oos;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const isOos = it => /out\.of\.stock/i.test(it.image_url || '');

  // "\images\dishes\01-01.webp" -> "../images/dishes/01-01-640.webp"
  function photoUrl(url, w){
    if(!url) return '';
    let u = String(url).replace(/\\/g,'/').replace(/^\.?\//,'');
    const m = u.match(/^(.*?)(?:-(?:320|640|1024))?\.(jpg|jpeg|png|webp)$/i);
    if (m) u = m[1] + '-' + (w || 640) + '.webp';
    return '../' + u;
  }
  // "Chicken: 120 | AUS Beef: 170" -> [{label, price}]
  function parseOptions(s){
    if(!s) return [];
    return String(s).split(/[|;]+/).map(p => {
      const [label='', price=''] = p.split(/[:=]/);
      return { label: label.trim(), price: price.trim() };
    }).filter(o => o.label);
  }
  // Options with the same price share one line: "Beef | Shrimp | Squid  140"
  function groupByPrice(opts){
    const out = [];
    opts.forEach(o => {
      const g = o.price ? out.find(x => x.price === o.price) : null;
      if (g) g.label += ' | ' + o.label; else out.push({ label: o.label, price: o.price });
    });
    return out;
  }
  const PRINT_ICONS = { spicy: '🌶️', vegetarian: '🌿', seafood: '🦐', nuts: '🥜' };
  const LEGEND = `<div class="legend"><span><b class="sig">★</b>Signature · เมนูแนะนำ · 招牌菜</span><span>🌶️ Spicy · เผ็ด · 辣</span><span>🌿 Vegetarian · มังสวิรัติ · 素食</span><span>🦐 Seafood · อาหารทะเล · 海鲜</span><span>🥜 Nuts · มีถั่ว · 含坚果</span>`
    + `<span class="lvl">🌶️ Spice level on request: mild · medium · hot  /  เลือกระดับความเผ็ดได้  /  可选辣度</span></div>`;
  // "vegetarian@Plain" -> icon + (Plain) — badge for one option only
  const badges = s => String(s||'').split(/[,|]+/).map(b => b.trim()).filter(Boolean);
  const prefixNum = p => String(p||'').split('-').map(Number);

  function dishHTML(it, idx, rows){
    const opts = groupByPrice(parseOptions(it.options_en));
    const priceHTML = opts.length
      ? `<div class="d-opts">${opts.map(o=>`<div><span class="lbl">${esc(o.label)}</span><span class="val">${esc(o.price)}</span></div>`).join('')}</div>`
      : (it.price ? `<div class="d-price">${esc(it.price)}</div>` : '');
    // Print = icons only (legend in the footer). No halal (logo in footer), no "new" (Artee, 2026-10-06)
    const b = badges(it.badges).map(t => { const [x0, q] = t.split('@'); const x = x0.trim().toLowerCase(); return { x, q: q ? q.trim() : '' }; })
      .filter(o => PRINT_ICONS[o.x])
      .map(({ x, q }) => `<span class="bdg ${esc(x)}" title="${esc(x)}">${x === 'spicy' ? PRINT_ICONS.spicy.repeat(Math.min(3, Math.max(1, parseInt(it.spice, 10) || 1))) : PRINT_ICONS[x]}${q ? `<small class="q">(${esc(q)})</small>` : ''}</span>`);
    if (String(it.sig) === '1') b.unshift('<span class="bdg sig">★</span>');
    const flip = (state.layout === 'classic' && idx % 2 === 1) ? ' flip' : '';
    const oos = isOos(it);
    return `
      <article class="dish${flip}">
        <div class="d-photo">${it.image_url ? `<img src="${esc(photoUrl(it.image_url, rows && rows <= 3 ? 1024 : 640))}" alt="">` : ''}${oos ? '<span class="oos-tag">OUT OF STOCK</span>' : ''}</div>
        <div class="d-text">
          <div class="d-head"><span class="d-num">${esc(it.prefix)}</span> <span class="d-th">${esc(it.th_name)}</span></div>
          <div class="d-en">${esc(it.en_name)}</div>
          ${it.cn_name ? `<div class="d-cn">${esc(it.cn_name)}</div>` : ''}
          ${it.desc_en ? `<div class="d-desc">${esc(it.desc_en)}</div>` : ''}
          <div class="d-bottom"><div class="d-badges">${b.join('')}</div>${priceHTML}</div>
        </div>
      </article>`;
  }

  // Filler tile for leftover space on a category's last page (classic layout)
  const QR_MENU = '../images/res/qr-menu.svg';      // -> https://tawansycnx.github.io/index.html
  const QR_REVIEW = '../images/res/qr-review.svg';  // -> Google Maps page (write a review)
  function fillerHTML(p){
    const free = p.rows - p.items.length;
    if (state.layout !== 'classic' || free < 1) return '';
    const small = free / p.rows <= 0.25;
    return `<div class="filler${small ? ' f-small' : ''}" style="grid-row:span ${free}">
      <div class="f-qr"><img src="${QR_MENU}" alt="QR online menu"><div class="t1">Full menu online</div><div class="t2">เมนูออนไลน์<br>在线菜单</div></div>
      <img class="f-logo" src="${LOGO}" alt="Tawansy">
      <div class="f-qr"><img src="${QR_REVIEW}" alt="QR Google review"><div class="t1">Review us on Google</div><div class="t2">รีวิวเราบน Google<br>在Google上评价我们</div></div>
    </div>`;
  }

  // Options key: the option words used on THIS page, in EN · TH · CN (one line in the footer; Artee 2026-10-06)
  function optionsKey(items){
    const seen = new Map();
    const lab = v => String(v||'').split(/[|;]+/).map(x => x.split(/[:=]/)[0].trim());
    items.forEach(it => {
      const en = lab(it.options_en), th = lab(it.options_th), cn = lab(it.options_cn);
      en.forEach((w, i) => { if (w && !seen.has(w)) seen.set(w, [th[i] || '', cn[i] || '']); });
    });
    if (!seen.size) return '';
    return `<span class="okey">${[...seen].map(([en, [th, cn]]) => `<span>${esc([en, th, cn].filter(Boolean).join(' · '))}</span>`).join('')}</span>`;
  }
  // keep the key on one line: shrink the text a little if a page ever has too many words
  function fitKeys(){
    document.querySelectorAll('.okey').forEach(k => {
      let pt = 6.3;
      while (k.scrollWidth > k.clientWidth + 1 && pt > 4.6) { pt -= 0.2; k.style.fontSize = pt + 'pt'; }
    });
  }

  function render(menu, cats){
    const per = PER_PAGE[state.layout];
    const order = cats.filter(c => c.id !== 'all').sort((a,b) => a.order - b.order);
    const pages = [];
    order.forEach(cat => {
      const items = menu
        .filter(it => it.category === cat.en_name && (state.oos || !isOos(it)))
        .sort((a,b) => { const x=prefixNum(a.prefix), y=prefixNum(b.prefix); return (x[0]-y[0]) || (x[1]-y[1]); });
      // Classic: biggest dish size that adds no pages (e.g. 5 dishes -> 3 + 2, 9 -> 3 + 3 + 3)
      const size = (state.layout === 'classic' && items.length) ? Math.ceil(items.length / Math.ceil(items.length / per)) : per;
      for (let i = 0; i < items.length; i += size)
        pages.push({ cat, items: items.slice(i, i + size), cont: i > 0, rows: size });
    });
    $('pages').className = 'pages layout-' + state.layout;
    $('pages').innerHTML = pages.map((p, n) => `
      <section class="page rows-${p.rows}">
        <header class="p-head">
          <div class="p-title"><span class="th">${esc(p.cat.th_name)}</span><span class="en">${esc(p.cat.en_name)}</span></div>
          <img class="p-logo" src="${LOGO}" alt="Tawansy">
        </header>
        <div class="p-rule"></div>
        <div class="p-body" style="--rows:${p.rows}">${p.items.map((it, i) => dishHTML(it, i, p.rows)).join('')}${fillerHTML(p)}</div>
        <footer class="p-foot">
          <img class="halal" src="${HALAL}" alt="Halal">
          ${LEGEND.replace('<div class="legend">', '<div class="legend">' + optionsKey(p.items))}
          <span class="f-spacer"></span>
        </footer>
      </section>`).join('');
    $('pageCount').textContent = `${pages.length} pages · ${pages.reduce((s,p)=>s+p.items.length,0)} dishes`;
    fitKeys();
    toJpeg().then(() => { document.documentElement.dataset.ready = '1'; });
  }

  // Chrome stores .webp photos uncompressed inside a PDF (~50 MB menu).
  // Converting each photo to JPEG first keeps the saved PDF small.
  const jpegCache = {};
  function toJpeg(){
    const imgs = [...document.querySelectorAll('.d-photo img')];
    return Promise.all(imgs.map(img => new Promise(done => {
      const src = img.getAttribute('src');
      const box = img.parentElement;
      if (jpegCache[src]) { img.src = jpegCache[src].url; box.classList.toggle('cutout', jpegCache[src].cutout); return done(); }
      const tmp = new Image();
      tmp.onload = () => {
        try {
          const c = document.createElement('canvas');
          c.width = tmp.naturalWidth; c.height = tmp.naturalHeight;
          const ctx = c.getContext('2d');
          ctx.drawImage(tmp, 0, 0);
          const px = ctx.getImageData(0, 0, c.width, c.height).data;
          let cutout = false;                       // any see-through pixels?
          for (let i = 3; i < px.length; i += 4 * 97) if (px[i] < 250) { cutout = true; break; }
          ctx.globalCompositeOperation = 'destination-over';
          ctx.fillStyle = '#ffffff';                // white behind see-through areas (JPEG has no transparency)
          ctx.fillRect(0, 0, c.width, c.height);
          jpegCache[src] = { url: c.toDataURL('image/jpeg', 0.85), cutout };
          img.src = jpegCache[src].url;
          box.classList.toggle('cutout', cutout);
        } catch (e) { /* keep original image */ }
        done();
      };
      tmp.onerror = () => done();
      tmp.src = src;
    })));
  }

  function syncUrl(){
    const q = new URLSearchParams();
    if (state.layout !== 'classic') q.set('layout', state.layout);
    if (state.oos) q.set('oos', '1');
    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
  }

  Promise.all([MENU_URL, CAT_URL].map(u => fetch(u, { cache:'no-store' }).then(r => { if(!r.ok) throw new Error(u + ' ' + r.status); return r.json(); })))
    .then(([menu, cats]) => {
      $('status').remove();
      const draw = () => { syncUrl(); render(menu, cats); };
      $('optLayout').onchange = e => { state.layout = e.target.value; draw(); };
      $('optOos').onchange = e => { state.oos = e.target.checked; draw(); };
      render(menu, cats);
    })
    .catch(err => {
      $('status').innerHTML = 'Could not load the menu data (' + esc(err.message) + ').<br>' +
        'Open this page through a web server (the live site, or VS Code “Live Server”) — not by double-clicking the file.';
    });
})();
</script>
</body>
</html>
